# Match the window opacity rule
background_opacity 0.8

# Use a deep, rich theme background color (e.g., Catppuccin Mocha) 
# rather than pure absolute black (#000000) for a true glassmorphism feel
background #161619

# Cursor trail animation
cursor_trail 3
cursor_trail_decay 0.08 0.22
cursor_trail_start_threshold 12 2
