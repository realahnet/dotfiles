general {
    hide_cursor = false
    grace = 0
    ignore_empty_input = true
    no_fade_in = false
    no_fade_out = false
    disable_loading_bar = false
}

# BACKGROUND (Live Desktop Blur)
background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)

    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

# CLOCK
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%-I:%M")<span size='20%'> $(date +"%p")</span>"
    color = rgba(255, 255, 255, 0.85)
    font_size = 80
    font_family = JetBrains Mono Nerd Font
    position = 0, 260
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 0.65)
    font_size = 18
    font_family = JetBrains Mono Nerd Font
    position = 0, 180
    halign = center
    valign = center
}

# PROFILE PICTURE
image {
    monitor =
    path = $HOME/.face
    size = 130
    rounding = -1
    border_size = 2
    border_color = rgba(255, 255, 255, 0.5)
    position = 0, 10
    halign = center
    valign = center
}

# USERNAME
label {
    monitor =
    text = $USER
    color = rgba(255, 255, 255, 0.8)
    font_size = 16
    font_family = JetBrains Mono Nerd Font
    position = 0, -85
    halign = center
    valign = center
}

# PASSWORD FIELD
input-field {
    monitor =
    size = 260, 45
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.5)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -145
    halign = center
    valign = center
}
