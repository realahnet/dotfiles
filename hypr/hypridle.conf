general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false
}

# --- Display off: 5 min on BATTERY ---
listener {
    timeout = 300
    condition_cmd = ~/.config/hypr/scripts/is-battery.sh
    condition_retry = 0
    on-timeout = loginctl lock-session && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# --- Display off: 10 min on AC ---
listener {
    timeout = 600
    condition_cmd = ~/.config/hypr/scripts/is-ac.sh
    condition_retry = 0
    on-timeout = loginctl lock-session && hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# --- Suspend: 1.5 hr, BATTERY ONLY (no AC listener == AC never suspends) ---
listener {
    timeout = 5400
    condition_cmd = ~/.config/hypr/scripts/is-battery.sh
    condition_retry = 0
    on-timeout = systemctl suspend
}
